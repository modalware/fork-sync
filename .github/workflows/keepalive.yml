name: Keepalive

# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. An empty commit each month keeps them enabled.

on:
  schedule:
    - cron: '0 4 15 * *'  # Monthly on 15th at UTC 4:00 (JST 13:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: prevent scheduled workflows from being disabled"
          git push
